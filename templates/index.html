<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .chat-container { max-width: 600px; margin: auto; }
        .message { padding: 10px; border-radius: 8px; margin: 5px 0; }
        .user-message { background-color: #ffa726; color: white; text-align: right; } /* Light orange */
        .bot-message { background-color: #e9ecef; color: black; text-align: left; }
    </style>
</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center">Gemini Chatbot</h2>
        <div class="chat-container border p-3 rounded bg-white">
            <div id="chat-box" class="mb-3" style="max-height: 400px; overflow-y: auto;"></div>
            <div class="input-group">
                <input type="text" id="user-input" class="form-control" placeholder="Type a message...">
                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let converter = new showdown.Converter();  // Initialize Showdown.js Markdown converter

        function sendMessage() {
            let userInput = $("#user-input").val().trim();
            if (!userInput) return;

            $("#chat-box").append(`<div class="message user-message">${userInput}</div>`);
            $("#user-input").val("");

            $.ajax({
                url: "/chat",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({ message: userInput }),
                success: function (response) {
                    let formattedResponse = converter.makeHtml(response.response);  // Convert Markdown to HTML
                    $("#chat-box").append(`<div class="message bot-message">${formattedResponse}</div>`);
                    $("#chat-box").scrollTop($("#chat-box")[0].scrollHeight);
                }
            });
        }

        $("#user-input").keypress(function (e) {
            if (e.which === 13) sendMessage();
        });
    </script>

</body>
</html>
